# Execute your favorite apps at launch
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland
# exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland DISPLAY XAUTHORITY
# exec-once = qs
exec-once = wlsunset -l -33 -L -70
exec-once = dropbox start
exec-once = brightnessctl set 50%

# gnome-keyring: pkcs11/secrets are already unlocked via GDM's PAM
# (pam_gnome_keyring auto_start) and socket-activated by systemd, but that
# unit only starts with --components="pkcs11,secrets". Join the running
# daemon and add the ssh component, then export SSH_AUTH_SOCK so it's
# visible to the systemd user session and dbus-activated services.
exec-once = bash -c 'eval $(gnome-keyring-daemon --start --components=pkcs11,secrets,ssh); systemctl --user import-environment SSH_AUTH_SOCK; dbus-update-activation-environment --systemd SSH_AUTH_SOCK'

