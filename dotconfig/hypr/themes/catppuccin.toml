fg_normal =  { color = "text", alpha = 0.80 }
fg_high =    "text"
fg_disabled = { color = "text", alpha = 0.40 }
accent1 = "sapphire"
accent2 = "yellow"
accent3 = "mauve"
warning = "yellow"
critical = "red"
success = "green"
window_bg =  { color = "base", alpha = 0.80 }
textbox_bg = "surface1"
prompt_fg =  "blue"
prompt_bg =  { color = "base", alpha = 0.80 }
placeholder_fg = { color = "text", alpha = 0.30 }
selected_bg =    { color = "subtext1", alpha = 0.10 }
