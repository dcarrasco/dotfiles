[bar]
order = [ "Main_bar" ]

    [bar.Main_bar]
    background_opacity = 0.75
    center = []
    concave_edge_corners = false
    end = [
        "tray",
        "notifications",
        "cpu",
        "sysmon",
        "keyboard_layout",
        "network",
        "bluetooth",
        "volume",
        "battery",
        "clock"
    ]
    font_family = "SF UI  Text"
    font_scale = 1.1
    font_weight = 400
    margin_ends = 0
    radius = 0
    scale = 1.1
    start = [ "launcher", "workspaces", "active_window" ]
    thickness = 36
    widget_spacing = 14

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 896.0
    cy = 938.0
    output = "eDP-1"
    placement_height = 1120.0
    placement_width = 1792.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
font_family = "Adwaita Sans"

    [shell.launcher]
    compact = true

    [shell.panel]
    launcher_placement = "attached"
    open_near_click_launcher = true

[theme]
builtin = "Tokyo-Night"
custom_palette = "noctalia-wallpaper-mc"

    [theme.templates]
    enable_builtin_templates = false

[wallpaper]
enabled = false

    [wallpaper.default]
    path = "/home/daniel/Imágenes/fondos pantalla/nature/OHR.WhararikiBeach_EN-US3505877495_UHD.jpg"

    [wallpaper.last]
    path = "/home/daniel/Imágenes/fondos pantalla/nature/OHR.WhararikiBeach_EN-US3505877495_UHD.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/daniel/Imágenes/fondos pantalla/nature/OHR.WhararikiBeach_EN-US3505877495_UHD.jpg"

    [[wallpaper.favorite]]
    path = "/home/daniel/Imágenes/BingWallpaper/20230826-MuseumIsland_ROW1489339993_UHD.jpg"
    theme_mode = "auto"

[widget.active_window]
display = "text_only"
max_length = 800

[widget.battery]
display_mode = "graphic"
scale = 0.80
show_label = false

[widget.clock]
format = "{: %a %d-%b %H:%M}"

[widget.keyboard_layout]
font_scale = 0.80

[widget.launcher]
glyph = "menu-2"
scale = 1.10

[widget.network]
show_label = false

[widget.sysmon]
stat = "ram_pct"

[widget.volume]
show_label = false

[widget.workspaces]
empty_color = "outline"
font_weight = 500
occupied_color = "on_surface"
style = "minimal"
